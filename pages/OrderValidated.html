<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/order.css">
</head>
<body>
    <!-- From Uiverse.io by Yaya12085 --> 
    <div class="popup">
            <span class="overlay-order"></span>
            <main class="order">
                <div class="card-order"> 
                    <a class="dismiss button" href="#">×</a> 
                    <div class="header-order"> 
                        <div class="image">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M20 7L9.00004 18L3.99994 13" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        </div> 
                        <div class="content-order">
                            <span class="title">Order validated</span> 
                            <p class="message">Thank you for your purchase. you package will be delivered within 2 days of your purchase</p> 
                        </div> 
                        <div class="actions-order">
                            <button class="history button" type="button">History</button> 
                            <button class="track button" type="button">Revenir en arriere</button> 
                        </div> 
                    </div> 
                </div>
            </main>
    </div>
</body>
</html>
