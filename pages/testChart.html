<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #myChart{
            max-width: 500px;
            max-height: 500px;
        }
    </style>
</head>
<body>
    

    <div>
        <canvas id="myChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
    const ctx = document.getElementById('myChart');
    new Chart(ctx, {
        type: 'pie',
        data: {
        labels: ['Red', 'Blue', 'Yellow', 'Left'],
        datasets: [{
            label: 'test chart',
            data: [12, 45, 3, 30],
            borderWidth: 5,
            backgroundColor: [
                "#EF4444",
                "#3B82F6" ,
                "#10B981",
                "#F59E0B"
            ],
            borderColor: new Array(5).fill("white",0,5)
        }]
        },
        options: {
        scales: {
            y: {
            beginAtZero: true
            } , 
        },
        animation : false,
        plugins:{
            legend:{display:true},
            tooltip:{enabled: true}
        }
        }
    });
    </script>
 
</body>
</html>
